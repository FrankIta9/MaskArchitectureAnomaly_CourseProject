# ============================================================================
# CONFIGURAZIONE SAFE: Outlier Exposure + Energy OOD con WARMUP CONSERVATIVO
# ============================================================================
#
# CONFIGURAZIONE CONSIGLIATA PER PARTIRE:
# - Max weight ridotto (3e-4 vs 1e-3) per evitare peggioramento calibrazione
# - Warmup corto ma reale (6 epoche hard-off) per evitare conflitto con OE
# - Schedule cosine per ramp smooth
#
# MOTIVAZIONE:
# - Se energy pesa troppo, peggiori "calibrazione" e spingi tutto verso
#   soluzioni che aiutano la loss ma rovinano l'anomaly score MSP/maxlogit
# - Warmup corto ma reale (6 epoche) evita conflitto con OE nella fase in cui
#   la rete ancora "impara a segmentare"
#
# RAMP EFFETTIVO:
# - Epochs 0-5: Energy DISABILITATO (weight=0.0), solo OE + loss standard
#   → Modello impara: COCO outliers = "no object" class
# - Epochs 6-30: Energy ATTIVATO gradualmente (cosine warmup 0→0.0003)
#   → Modello raffina: separazione energia ID/OOD
#
# Ottimizzata per training stabile

trainer:
  max_epochs: 30
  
  # Batch size e precision (adatta alle tue risorse)
  # Config "safe" per batch_size 2: accumulate_grad_batches 2 per stabilità simile a batch 4
  accumulate_grad_batches: 2
  precision: "32-true"  # Full precision per stabilità
  gradient_clip_val: 1.0
  
  # Checkpoint salvati sul drive (adatta il path se necessario)
  # Per Colab: usa /content/drive/MyDrive/checkpoints
  # Per locale: usa un path assoluto o relativo
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "/content/drive/MyDrive/checkpoints"  # Colab Drive path (modifica se necessario)
        filename: "eomt_1024_oe_energy_safe-{epoch:03d}-{metrics/val_iou_all:.4f}"
        monitor: "metrics/val_iou_all"
        mode: "max"
        save_top_k: 3
        save_last: true
        save_weights_only: false  # Salva anche optimizer state per permettere resume
        every_n_epochs: 1
  
  # DEBUG: Wandb disabilitato per evitare GraphQL retry e stacktrace pulita
  # logger:
  #   class_path: lightning.pytorch.loggers.wandb.WandbLogger
  #   init_args:
  #     resume: allow
  #     project: "eomt"
  #     name: "OE+Energy_Safe_warmup6_lr1e5"

model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    # IMPORTANTE: Aggiungi il path ai tuoi pesi pre-addestrati
    # Sostituisci con il path reale
    ckpt_path: "/path/to/eomt_cityscapes.bin"
    
    attn_mask_annealing_enabled: True
    attn_mask_annealing_start_steps: [3317, 8292, 13268]
    attn_mask_annealing_end_steps: [6634, 11609, 16585]
    
    # Learning rate conservativo per fine-tuning gentile
    # Preserva conoscenza pre-addestrata mentre OE insegna anomaly detection
    lr: 5e-5
    
    # ===== ENERGY OOD LOSS CON WARMUP CONSERVATIVO =====
    # Configurazione SAFE per partire
    energy_ood_enabled: true
    energy_ood_max_weight: 0.0003      # 3e-4 (molto più safe di 1e-3)
    energy_warmup_start_epoch: 0       # Inizia warmup da epoch 0
    energy_warmup_epochs: 6            # Hard-off per 6 epoche (0-5: weight=0.0)
    max_epochs: 30                     # Total epochs (per warmup scheduler)
    # Note: warmup_schedule è hardcoded a "cosine" nel codice (smooth ramp)
    
    # Come funziona:
    # - Epochs 0-5: energy_weight = 0.0 (solo OE + loss standard)
    # - Epochs 6-30: energy_weight aumenta 0.0 → 0.0003 (cosine schedule)
    # Ramp effettivo: dal termine warmup (epoch 6) fino a max_epochs (epoch 30)
    # Risultato: no conflitto, convergenza stabile + energy refinement conservativo
    
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 100
        num_blocks: 3
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_base_patch14_reg4_dinov2

data:
  class_path: datasets.cityscapes_semantic_with_oe.CityscapesSemanticWithOE
  init_args:
    # Path al dataset Cityscapes (adatta il path)
    path: "/path/to/Cityscapes"
    
    # Batch size (config "safe" per batch_size 2 con accumulate_grad_batches 2)
    batch_size: 2
    num_workers: 0  # DEBUG: 0 per stacktrace pulita e debug lineare
    
    # IMPORTANTE: 1024x1024 per compatibilità con i pesi pre-addestrati
    img_size: [1024, 1024]
    
    num_classes: 19
    color_jitter_enabled: true
    scale_range: [0.5, 2.0]
    check_empty_targets: true
    
    # ===== CONFIGURAZIONE COCO OUTLIER EXPOSURE (HYBRID STRATEGY) =====
    # Path alla directory che contiene i file zip COCO (adatta il path)
    coco_path: "/path/to/coco2017_zips"
    
    # Usa train2017 per più varietà (più oggetti disponibili)
    coco_split: "train2017"
    
    # IMPORTANTE: true perché hai i file in formato zip
    use_coco_zip: true
    
    # HYBRID STRATEGY: Probabilità separate per ID paste (mappabile) vs OOD paste (non-mappabile)
    # ID paste: categorie COCO mappabili a Cityscapes (person, car, bicycle, etc.) → supervised augmentation
    # OOD paste: categorie COCO non mappabili (chair, laptop, etc.) → outlier exposure
    p_id_paste: 0.10    # 10% batch ha ID paste (range 0.05-0.15, conservativo per non distruggere Cityscapes)
    p_ood_paste: 0.30   # 30% batch ha OOD paste (range 0.20-0.35, curriculum learning)
    max_overlap_ratio: 0.02  # Max overlap con GT esistente (2% per evitare corruzione labels)
    
    # DEPRECATED: paste_probability (mantenuto per backward compatibility, non usato)
    paste_probability: 0.30
    min_objects: 1              # Min oggetti da incollare per immagine
    max_objects: 2              # Max 2 oggetti (ridotto per stabilità)
    min_scale: 0.22             # Oggetti più grandi (22% immagine)
    max_scale: 0.40             # Oggetti più grandi (40% immagine)
    coco_min_area: 3000         # Solo oggetti ben definiti e visibili
    
    # P0 Fix: Y position range e blending (Fishyscapes-like)
    paste_y_range: [0.70, 0.98]  # Bias verso bottom (on-road proxy) - più aggressivo
    use_perspective_aware: true
    perspective_strength: 1.0    # 100% strength per prospettiva (Fishyscapes-like)
    min_obj_size_px: 35          # Min object size in pixels (30-40 range)
    
    # Drivable region constraints
    use_drivable_regions: true
    drivable_class_ids: [0, 1]  # Road=0, Sidewalk=1
    
    # Blending
    blend_alpha: 1.0             # 1.0 = dry paste (più stabile)
